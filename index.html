<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐿️ Chipmunk Sings Happy Birthday 🎂</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #ffe4ec 0%, #ffb6c1 60%, #ff8fb1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    #scene-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .overlay-title {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }

    .overlay-title h1 {
      font-size: 2.4rem;
      font-weight: 800;
      color: #c71585;
      text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(199, 21, 133, 0.25);
      letter-spacing: 1px;
    }

    /* Speech bubble */
    .speech-bubble {
      position: fixed;
      top: 14%;
      left: 50%;
      transform: translateX(-50%) scale(0);
      z-index: 20;
      background: #fff;
      color: #c71585;
      font-size: 1.4rem;
      font-weight: 800;
      padding: 0.9rem 1.8rem;
      border-radius: 30px;
      border: 3px solid #ff69b4;
      box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4);
      white-space: nowrap;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      opacity: 0;
      pointer-events: none;
    }

    .speech-bubble.show {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 14px 12px 0 12px;
      border-style: solid;
      border-color: #fff transparent transparent transparent;
      filter: drop-shadow(0 3px 0 #ff69b4);
    }

    /* Music notes floating up */
    .note {
      position: fixed;
      font-size: 1.8rem;
      z-index: 15;
      pointer-events: none;
      animation: noteRise 2.5s ease-out forwards;
      opacity: 0;
    }

    @keyframes noteRise {
      0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-180px) scale(1.2) rotate(25deg); opacity: 0; }
    }

    /* Replay button */
    .replay-btn {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: linear-gradient(135deg, #ff69b4, #ff1493);
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #c71585, 0 10px 20px rgba(255, 20, 147, 0.5);
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .replay-btn:hover {
      transform: translateX(-50%) translateY(-3px);
      box-shadow: 0 9px 0 #c71585, 0 14px 25px rgba(255, 20, 147, 0.6);
    }

    .replay-btn:active {
      transform: translateX(-50%) translateY(4px);
      box-shadow: 0 2px 0 #c71585, 0 5px 10px rgba(255, 20, 147, 0.4);
    }

    @media (max-width: 550px) {
      .overlay-title h1 { font-size: 1.5rem; }
      .speech-bubble { font-size: 1rem; padding: 0.7rem 1.2rem; white-space: normal; max-width: 85vw; }
      .replay-btn { font-size: 1rem; padding: 0.7rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div id="scene-container"></div>

  <div class="overlay-title">
    <h1>🐿️ Happy Birthday, Jess! 🎂</h1>
  </div>

  <div class="speech-bubble" id="speechBubble">🎵 Happy Birthday to you... 🎵</div>

  <button class="replay-btn" id="replayBtn">🔁 Replay Show</button>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- SCENE SETUP ----------
    const container = document.getElementById('scene-container');
    const scene = new THREE.Scene();
    scene.background = null; // let CSS gradient show through

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.2, 7);
    camera.lookAt(0, 1.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // ---------- LIGHTS ----------
    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(4, 8, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -6;
    scene.add(keyLight);

    const pinkFill = new THREE.PointLight(0xff69b4, 0.8, 20);
    pinkFill.position.set(-4, 3, 3);
    scene.add(pinkFill);

    const rimLight = new THREE.PointLight(0xffd700, 0.6, 20);
    rimLight.position.set(3, 2, -4);
    scene.add(rimLight);

    // ---------- GROUND (soft circle platform) ----------
    const groundGeo = new THREE.CylinderGeometry(3.2, 3.2, 0.25, 64);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0xffd6e8, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.y = -0.13;
    ground.receiveShadow = true;
    scene.add(ground);

    // ---------- CHIPMUNK CONSTRUCTION ----------
    // Group holds the whole chipmunk so we can animate it as one unit
    const chipmunk = new THREE.Group();
    scene.add(chipmunk);

    // Materials
    const furMat = new THREE.MeshStandardMaterial({ color: 0xc98a5b, roughness: 0.8 });
    const furLightMat = new THREE.MeshStandardMaterial({ color: 0xf2d9b8, roughness: 0.8 });
    const bellyMat = new THREE.MeshStandardMaterial({ color: 0xfff3e0, roughness: 0.9 });
    const stripeDarkMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.8 });
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4 });
    const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
    const pinkMat = new THREE.MeshStandardMaterial({ color: 0xff69b4, roughness: 0.5 });
    const noseMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.4 });

    // --- BODY ---
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 32), furMat);
    body.scale.set(1, 1.15, 0.95);
    body.position.y = 1.0;
    body.castShadow = true;
    body.receiveShadow = true;
    chipmunk.add(body);

    // Belly
    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 24), bellyMat);
    belly.scale.set(0.9, 1.05, 0.55);
    belly.position.set(0, 0.95, 0.55);
    belly.castShadow = true;
    chipmunk.add(belly);

    // Back stripes (chipmunk signature)
    for (let i = -1; i <= 1; i++) {
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, 0.05), stripeDarkMat);
      stripe.position.set(i * 0.18, 1.25, -0.55);
      stripe.rotation.x = -0.35;
      chipmunk.add(stripe);
    }

    // --- HEAD ---
    const head = new THREE.Group();
    head.position.y = 2.0;
    chipmunk.add(head);

    const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.68, 32, 32), furMat);
    headMesh.scale.set(1, 0.95, 0.95);
    headMesh.castShadow = true;
    head.add(headMesh);

    // Cheeks (light fur)
    const cheekL = new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 20), furLightMat);
    cheekL.position.set(-0.42, -0.1, 0.35);
    cheekL.scale.set(1, 0.85, 0.8);
    head.add(cheekL);
    const cheekR = cheekL.clone();
    cheekR.position.x = 0.42;
    head.add(cheekR);

    // Muzzle
    const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 20), bellyMat);
    muzzle.position.set(0, -0.12, 0.55);
    muzzle.scale.set(1, 0.8, 0.7);
    head.add(muzzle);

    // Nose
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), noseMat);
    nose.position.set(0, -0.05, 0.82);
    head.add(nose);

    // Eyes
    const eyeGeo = new THREE.SphereGeometry(0.13, 16, 16);
    const eyeL = new THREE.Mesh(eyeGeo, blackMat);
    eyeL.position.set(-0.25, 0.15, 0.55);
    head.add(eyeL);
    const eyeR = eyeL.clone();
    eyeR.position.x = 0.25;
    head.add(eyeR);

    // Eye shine
    const shineGeo = new THREE.SphereGeometry(0.045, 8, 8);
    const shineL = new THREE.Mesh(shineGeo, whiteMat);
    shineL.position.set(-0.28, 0.19, 0.65);
    head.add(shineL);
    const shineR = shineL.clone();
    shineR.position.x = 0.22;
    head.add(shineR);

    // Ears
    const earGeo = new THREE.SphereGeometry(0.2, 16, 16);
    const earL = new THREE.Mesh(earGeo, furMat);
    earL.position.set(-0.45, 0.55, 0);
    earL.scale.set(1, 1.1, 0.5);
    earL.castShadow = true;
    head.add(earL);
    const earR = earL.clone();
    earR.position.x = 0.45;
    head.add(earR);

    // Inner ears (pink)
    const innerEarGeo = new THREE.SphereGeometry(0.11, 12, 12);
    const innerEarL = new THREE.Mesh(innerEarGeo, pinkMat);
    innerEarL.position.set(-0.45, 0.57, 0.08);
    innerEarL.scale.set(1, 1.1, 0.3);
    head.add(innerEarL);
    const innerEarR = innerEarL.clone();
    innerEarR.position.x = 0.45;
    head.add(innerEarR);

    // Mouth (small open oval for singing)
    const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), blackMat);
    mouth.position.set(0, -0.22, 0.72);
    mouth.scale.set(1, 0.7, 0.5);
    head.add(mouth);

    // --- ARMS ---
    function makeArm(side) {
      const armGroup = new THREE.Group();
      const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.35, 6, 12), furMat);
      upper.position.y = -0.2;
      upper.castShadow = true;
      armGroup.add(upper);
      const paw = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), furLightMat);
      paw.position.y = -0.42;
      paw.castShadow = true;
      armGroup.add(paw);
      armGroup.position.set(side * 0.85, 1.35, 0.1);
      armGroup.rotation.z = side * -0.3;
      return armGroup;
    }
    const armL = makeArm(-1);
    const armR = makeArm(1);
    chipmunk.add(armL);
    chipmunk.add(armR);

    // --- LEGS / FEET ---
    function makeFoot(side) {
      const foot = new THREE.Group();
      const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.25, 6, 12), furMat);
      leg.position.y = -0.1;
      leg.castShadow = true;
      foot.add(leg);
      const paw = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 12), furLightMat);
      paw.position.set(0, -0.28, 0.1);
      paw.scale.set(1, 0.7, 1.3);
      paw.castShadow = true;
      foot.add(paw);
      foot.position.set(side * 0.35, 0.15, 0.15);
      return foot;
    }
    const footL = makeFoot(-1);
    const footR = makeFoot(1);
    chipmunk.add(footL);
    chipmunk.add(footR);

    // --- TAIL (big fluffy chipmunk tail) ---
    const tailGroup = new THREE.Group();
    tailGroup.position.set(0, 0.9, -0.7);
    chipmunk.add(tailGroup);

    const tailSegments = 5;
    for (let i = 0; i < tailSegments; i++) {
      const t = i / (tailSegments - 1);
      const radius = 0.35 - t * 0.18;
      const seg = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 16, 16),
        i % 2 === 0 ? furMat : furLightMat
      );
      seg.position.set(0, 0.15 + t * 1.5, -t * 0.4);
      seg.castShadow = true;
      tailGroup.add(seg);
    }
    // Tail tip (lighter)
    const tailTip = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), furLightMat);
    tailTip.position.set(0, 1.75, -1.9);
    tailTip.castShadow = true;
    tailGroup.add(tailTip);

    // Position whole chipmunk
    chipmunk.position.y = 0.15;

    // Store references for animation
    const parts = { head, armL, armR, footL, footR, tailGroup, mouth, body };

    // ---------- ANIMATION STATE ----------
    const clock = new THREE.Clock();
    let state = 'idle'; // idle | singing | backflip | done
    let stateTime = 0;
    let flipProgress = 0;

    const speechBubble = document.getElementById('speechBubble');
    const lyrics = [
      { text: '🎵 Happy Birthday to you... 🎵', at: 0.5 },
      { text: '🎵 Happy Birthday to you... 🎵', at: 2.5 },
      { text: '🎵 Happy Birthday dear Jess... 🎵', at: 4.5 },
      { text: '🎵 Happy Birthday to you! 🎉', at: 6.5 }
    ];
    let currentLyric = -1;

    function playShow() {
      state = 'singing';
      stateTime = 0;
      currentLyric = -1;
      flipProgress = 0;
      chipmunk.rotation.set(0, 0, 0);
      chipmunk.position.y = 0.15;
      speechBubble.classList.remove('show');
    }

    // ---------- NOTE SPAWNER ----------
    function spawnNote() {
      const notes = ['🎵', '🎶', '🎵', '🎶', '🎤'];
      const note = document.createElement('div');
      note.classList.add('note');
      note.textContent = notes[Math.floor(Math.random() * notes.length)];
      // Position near the chipmunk's mouth (roughly center of screen, slightly up)
      const x = window.innerWidth / 2 + (Math.random() - 0.5) * 120;
      const y = window.innerHeight * 0.45;
      note.style.left = x + 'px';
      note.style.top = y + 'px';
      document.body.appendChild(note);
      setTimeout(() => note.remove(), 2600);
    }

    // ---------- RENDER LOOP ----------
    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.getElapsedTime();

      // Idle breathing
      chipmunk.scale.y = 1 + Math.sin(t * 3) * 0.015;
      chipmunk.scale.x = 1 - Math.sin(t * 3) * 0.008;
      chipmunk.scale.z = 1 - Math.sin(t * 3) * 0.008;

      // Tail gentle sway
      parts.tailGroup.rotation.z = Math.sin(t * 2) * 0.12;
      parts.tailGroup.rotation.x = Math.sin(t * 1.5) * 0.08;

      // Head gentle bob
      parts.head.rotation.z = Math.sin(t * 1.8) * 0.04;

      if (state === 'singing') {
        stateTime += dt;

        // Mouth open/close like singing
        const mouthOpen = 0.5 + Math.sin(stateTime * 12) * 0.5;
        parts.mouth.scale.y = 0.7 + mouthOpen * 0.9;
        parts.mouth.scale.x = 1 + mouthOpen * 0.2;

        // Arms sway
        parts.armL.rotation.z = -0.3 + Math.sin(stateTime * 4) * 0.25;
        parts.armR.rotation.z = 0.3 - Math.sin(stateTime * 4) * 0.25;

        // Head bob more
        parts.head.rotation.x = Math.sin(stateTime * 6) * 0.06;

        // Show lyrics and spawn notes
        for (let i = 0; i < lyrics.length; i++) {
          if (stateTime > lyrics[i].at && currentLyric < i) {
            currentLyric = i;
            speechBubble.textContent = lyrics[i].text;
            speechBubble.classList.add('show');
            // Spawn a burst of notes
            for (let j = 0; j < 3; j++) {
              setTimeout(spawnNote, j * 150);
            }
          }
        }

        // After singing, transition to backflip
        if (stateTime > 8.5) {
          state = 'backflip';
          stateTime = 0;
          flipProgress = 0;
          speechBubble.classList.remove('show');
        }
      }

      if (state === 'backflip') {
        stateTime += dt;

        // Prep: crouch slightly
        if (stateTime < 0.4) {
          chipmunk.position.y = 0.15 - stateTime * 0.3;
          chipmunk.scale.y = 1 - stateTime * 0.15;
          chipmunk.scale.x = 1 + stateTime * 0.1;
        } else {
          // Jump + flip
          const jumpTime = stateTime - 0.4;
          const jumpDuration = 1.6;

          if (jumpTime < jumpDuration) {
            const p = jumpTime / jumpDuration;
            // Jump arc
            const jumpHeight = Math.sin(p * Math.PI) * 2.2;
            chipmunk.position.y = 0.15 + jumpHeight;

            // Full backflip rotation (around X axis)
            flipProgress = p * Math.PI * 2;
            chipmunk.rotation.x = -flipProgress;

            // Tuck limbs during flip
            const tuck = Math.sin(p * Math.PI);
            parts.armL.rotation.z = -0.3 - tuck * 1.2;
            parts.armR.rotation.z = 0.3 + tuck * 1.2;
            parts.footL.rotation.x = tuck * 0.8;
            parts.footR.rotation.x = tuck * 0.8;

            // Squash & stretch
            chipmunk.scale.y = 1 + Math.sin(p * Math.PI) * 0.15;
            chipmunk.scale.x = 1 - Math.sin(p * Math.PI) * 0.1;

            // Spawn notes during flip
            if (Math.random() < 0.3) spawnNote();
          } else {
            // Landed
            chipmunk.position.y = 0.15;
            chipmunk.rotation.x = 0;
            chipmunk.scale.set(1, 1, 1);
            parts.armL.rotation.z = -0.3;
            parts.armR.rotation.z = 0.3;
            parts.footL.rotation.x = 0;
            parts.footR.rotation.x = 0;

            if (stateTime > jumpDuration + 0.8) {
              state = 'done';
              stateTime = 0;
              speechBubble.textContent = '🎉 Ta-da! Happy Birthday! 🎂';
              speechBubble.classList.add('show');
            }
          }
        }
      }

      if (state === 'done') {
        stateTime += dt;
        // Little celebratory bounce
        chipmunk.position.y = 0.15 + Math.abs(Math.sin(stateTime * 4)) * 0.15;
        parts.armL.rotation.z = -0.3 + Math.sin(stateTime * 6) * 0.3;
        parts.armR.rotation.z = 0.3 - Math.sin(stateTime * 6) * 0.3;

        if (stateTime > 3) {
          // Hide bubble, ready to replay
          speechBubble.classList.remove('show');
          state = 'idle';
          stateTime = 0;
        }
      }

      // Slow camera drift for life
      camera.position.x = Math.sin(t * 0.3) * 0.5;
      camera.lookAt(0, 1.4, 0);

      renderer.render(scene, camera);
    }

    // ---------- RESIZE ----------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- START ----------
    document.getElementById('replayBtn').addEventListener('click', playShow);

    // Auto-start after a short delay
    setTimeout(playShow, 800);

    animate();
  </script>
</body>
</html>
